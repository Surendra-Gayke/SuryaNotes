[versions]

agp = "8.12.0"

kotlin = "2.2.10"

composeBom = "2026.06.01"

activityCompose = "1.10.1"

navigation = "2.9.3"

lifecycle = "2.9.2"

room = "2.7.2"

koin = "4.1.0"

coil = "2.7.0"

serialization = "1.9.0"

datastore = "1.1.7"

coreKtx = "1.17.0"

coroutines = "1.10.2"

material3Adaptive = "1.1.0"

material = "1.12.0"

[libraries]

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }

compose-ui = { module = "androidx.compose.ui:ui" }

compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

compose-ui-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

compose-material3 = { module = "androidx.compose.material3:material3" }

compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

koin-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }

material = { module = "com.google.android.material:material", version.ref = "material" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

ksp = { id = "com.google.devtools.ksp", version = "2.2.10-2.0.2" }

kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }